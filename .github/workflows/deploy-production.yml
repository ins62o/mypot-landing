name: Deploy Mypot Landing

on:
  push:
    branches:
      - Production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mypot-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')
          OIDC_PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          # JWT Base64URL 패딩 보정
          case $((${#OIDC_PAYLOAD} % 4)) in
            2) OIDC_PAYLOAD="${OIDC_PAYLOAD}==" ;;
            3) OIDC_PAYLOAD="${OIDC_PAYLOAD}=" ;;
          esac

          echo "$OIDC_PAYLOAD" \
            | tr '_-' '/+' \
            | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_id, repository_owner, repository_owner_id, ref}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: 896421757212
          role-session-name: mypot-landing-deploy

      - name: Deploy static assets
        run: |
          aws s3 sync dist/assets s3://mypot-landing/assets \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy HTML and public files
        run: |
          aws s3 sync dist s3://mypot-landing \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E13YUHP4RIFSNO \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Mypot Landing 배포 완료 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://mypot.kr" >> "$GITHUB_STEP_SUMMARY"