name: Deploy Mypot Landing

on:
  push:
    branches:
      - Production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mypot-landing-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub
        run: |
          echo "Repository=$GITHUB_REPOSITORY"
          echo "Ref=$GITHUB_REF"
          echo "RefName=$GITHUB_REF_NAME"
          echo "Event=$GITHUB_EVENT_NAME"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -d dist/assets

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Deploy static assets
        run: |
          aws s3 sync dist/assets s3://mypot-landing/assets \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy HTML and public files
        run: |
          aws s3 sync dist s3://mypot-landing \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E13YUHP4RIFSNO \
            --paths "/*"

      - name: Deployment summary
        run: |
          echo "## Mypot Landing 배포 완료 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://mypot.kr" >> "$GITHUB_STEP_SUMMARY"